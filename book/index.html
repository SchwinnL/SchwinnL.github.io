<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Book a meeting with Leo Schwinn</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1c2230; --muted: #5d6878; --line: #e2e6eb;
    --accent: #2457d6; --accent-text: #ffffff; --accent-soft: #e9effd;
    --danger: #c42b2b; --ok: #1d7d4c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #181d23; --text: #e7eaee; --muted: #9aa4b0; --line: #2a3039;
      --accent: #7aa2ff; --accent-text: #0b1020; --accent-soft: #1d2840;
      --danger: #ff8080; --ok: #4cc98b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 860px; margin: 32px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
  .owner { color: var(--muted); font-size: 14px; margin: 0 0 2px; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0 0 6px; }
  h2 { font-size: 20px; margin: 0 0 8px; }
  .desc { color: var(--muted); margin: 0 0 22px; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 999px;
          padding: 6px 14px; font: inherit; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .picker { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; }
  .month-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .nav { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: transparent;
         color: var(--text); font-size: 16px; cursor: pointer; }
  .nav:disabled { opacity: .3; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .dow { font-size: 12px; color: var(--muted); padding: 4px 0; }
  .day { height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--muted);
         font: inherit; opacity: .45; padding: 0; }
  .day.avail { background: var(--accent-soft); color: var(--accent); font-weight: 600; opacity: 1; cursor: pointer; }
  .day.sel { background: var(--accent); color: var(--accent-text); }
  .times { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px;
           max-height: 330px; overflow-y: auto; padding-right: 2px; }
  .time { border: 1px solid var(--accent); border-radius: 8px; background: transparent; color: var(--accent);
          padding: 9px 0; font: inherit; font-weight: 600; cursor: pointer; }
  .time:hover { background: var(--accent-soft); }
  .note { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 12px 14px;
             border-radius: 10px; background: var(--accent-soft); margin-bottom: 20px; }
  form { display: grid; gap: 14px; max-width: 520px; }
  label, .field { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
  .opt { font-weight: 400; color: var(--muted); }
  input, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
                    background: var(--card); color: var(--text); font: inherit; font-weight: 400; }
  textarea { min-height: 80px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .guest-row { display: flex; gap: 8px; }
  .remove { flex: 0 0 40px; border: 1px solid var(--line); border-radius: 8px; background: transparent;
            color: var(--muted); font-size: 18px; cursor: pointer; }
  .link-btn { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; justify-self: start; }
  .primary { justify-self: start; padding: 11px 20px; border: 0; border-radius: 8px; background: var(--accent);
             color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
  .primary.danger { background: var(--danger); color: #fff; }
  .primary:disabled { opacity: .6; cursor: default; }
  .error { color: var(--danger); font-size: 14px; margin: 0; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 12px 0; }
  .wait { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 12px 0; }
  .spinner { flex: 0 0 18px; width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .types { display: grid; gap: 12px; }
  .type { display: block; padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; }
  .type:hover { border-color: var(--accent); }
  .type b { font-size: 16px; }
  .ok-icon { display: grid; place-items: center; width: 44px; height: 44px; margin-bottom: 12px;
             border-radius: 50%; background: var(--ok); color: #fff; font-size: 22px; }
  a { color: var(--accent); }
  .export { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); }
  .export-panel { margin-top: 14px; }
  canvas.week { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 10px; }
  .export-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .secondary { padding: 9px 14px; border: 1px solid var(--accent); border-radius: 8px; background: transparent;
               color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }
  @media (max-width: 680px) {
    .wrap { margin: 16px auto; }
    .card { padding: 20px; }
    .picker { grid-template-columns: 1fr; gap: 24px; }
  }
</style>
</head>
<body>
<div class="wrap"><main class="card" id="app"></main></div>

<script>
// Set when the page is hosted on your own website; empty when Apps Script serves it.
const API_URL = 'https://script.google.com/macros/s/AKfycbxYXrM0m8EumOhEuc_oDaOBYL5jQscQT_absQVgBeotMOqvZN2QDcL9jgjum1XkAM048Q/exec';
let BOOT = null;
const app = document.getElementById('app');
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
const fmtTime = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit' });
const fmtDay = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtMonth = new Intl.DateTimeFormat('en-GB', { month: 'long', year: 'numeric' });
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const monthStart = d => new Date(d.getFullYear(), d.getMonth(), 1);

/** Tiny DOM helper: h('div', {class: 'x', onclick: fn}, child, ...). */
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v == null || v === false) return;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'text') el.textContent = v;
    else el.setAttribute(k, v === true ? '' : v);
  });
  children.flat().forEach(c => c != null && c !== false && el.append(c));
  return el;
}

/** Replaces an element's children, skipping null/false entries. */
function put(el, ...kids) {
  el.replaceChildren(...kids.flat().filter(k => k != null && k !== false));
}

/** Calls the Apps Script backend: directly when served by Apps Script, otherwise via the JSON API. */
function call(name, ...args) {
  if (!API_URL && window.google && google.script && google.script.run) {
    return new Promise((resolve, reject) =>
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
  }
  const post = body => fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const request = {
    config: () => fetch(`${API_URL}?${new URLSearchParams(Object.assign({ api: 'config' }, args[0]))}`),
    getSlots: () => fetch(`${API_URL}?${new URLSearchParams({ api: 'slots', t: args[0], d: args[1] })}`),
    getBusy: () => fetch(`${API_URL}?api=busy`),
    book: () => post({ action: 'book', req: args[0] }),
    cancelBooking: () => post({ action: 'cancel', id: args[0], k: args[1] }),
  }[name];
  const once = () => request().then(r => r.json().catch(() => {
    throw new Error('The booking service did not respond. Please reload the page.');
  }));
  // Google occasionally answers with an HTML error page; retry reads once (never bookings).
  const isRead = name === 'config' || name === 'getSlots' || name === 'getBusy';
  return once()
    .catch(err => (isRead ? new Promise(r => setTimeout(r, 1000)).then(once) : Promise.reject(err)))
    .then(res => { if (!res.ok) throw new Error(res.error); return res.data; });
}

function cleanError(err) {
  return String((err && err.message) || err).replace(/^(Exception|Error):\s*/, '');
}

function header(title, desc) {
  return [
    h('p', { class: 'owner', text: BOOT.owner }),
    h('h1', { text: title }),
    desc ? h('p', { class: 'desc', text: desc }) : null,
  ];
}

/** Spinner with a hint that Google can be slow to answer. */
function waiting(text) {
  return h('div', { class: 'wait', role: 'status' }, h('span', { class: 'spinner' }),
    h('span', {}, text, ' ', h('span', { class: 'opt', text: 'This can take up to 30 seconds.' })));
}

// Slot requests per duration, shared so prefetched results are reused.
const slotRequests = {};
function fetchSlots(typeId, d) {
  if (!slotRequests[d]) {
    slotRequests[d] = call('getSlots', typeId, d);
    slotRequests[d].catch(() => { delete slotRequests[d]; });
  }
  return slotRequests[d];
}
function resetSlots() {
  Object.keys(slotRequests).forEach(k => { delete slotRequests[k]; });
}

function durationText(list) {
  return list.length > 1 ? `${list[0]}–${list[list.length - 1]} min` : `${list[0]} min`;
}

// ---------------------------------------------------------------------------
// Overview and not found
// ---------------------------------------------------------------------------

function renderIndex() {
  const list = BOOT.types.length
    ? h('div', { class: 'types' }, BOOT.types.map(t =>
        h('a', { class: 'type', href: `${BOOT.baseUrl}?t=${encodeURIComponent(t.id)}` },
          h('b', { text: t.title }),
          h('div', { class: 'muted', text: [durationText(t.durations), t.description].filter(Boolean).join(' · ') }))))
    : h('p', { class: 'empty', text: 'Please use the booking link you were sent.' });
  put(app, ...header('Book a meeting'), list, exportSection());
}

function renderNotFound() {
  put(app, ...header('Link not found'),
    h('p', { class: 'muted', text: 'This booking link does not exist or is no longer active.' }));
}

// ---------------------------------------------------------------------------
// Booking
// ---------------------------------------------------------------------------

let T;
const S = { duration: null, slots: [], byDay: {}, month: null, day: null, slot: null,
            loading: false, paused: false, notice: '', step: 'pick', result: null };
let body, durationBox;

function renderBook() {
  S.duration = T.durations.includes(30) ? 30 : T.durations[0];
  body = h('section');
  durationBox = T.durations.length > 1
    ? h('div', {},
        h('p', { class: 'label', text: 'Duration' }),
        h('div', { class: 'chips' }, T.durations.map(d =>
          h('button', { class: 'chip', type: 'button', 'data-d': d, onclick: () => setDuration(d) }, `${d} min`))))
    : h('p', { class: 'muted', text: `${T.durations[0]} min` });
  put(app, ...header(T.title, T.description), durationBox, body, exportSection());
  setDuration(S.duration);
}

function setDuration(d) {
  S.duration = d;
  app.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(Number(c.dataset.d) === d)));
  loadSlots();
}

function loadSlots() {
  S.loading = true;
  S.step = 'pick';
  draw();
  const d = S.duration;
  fetchSlots(T.id, d)
    .then(res => {
      if (d !== S.duration) return; // the visitor switched duration meanwhile
      S.loading = false;
      S.paused = res.paused;
      S.slots = res.slots || [];
      S.byDay = {};
      S.slots.forEach(ms => (S.byDay[dayKey(new Date(ms))] ||= []).push(ms));
      if (!S.byDay[S.day]) S.day = S.slots.length ? dayKey(new Date(S.slots[0])) : null;
      S.month = S.day ? monthStart(new Date(S.byDay[S.day][0])) : null;
      draw();
      T.durations.forEach(x => fetchSlots(T.id, x)); // prefetch the other durations
    })
    .catch(err => {
      if (d !== S.duration) return;
      S.loading = false;
      S.notice = cleanError(err);
      draw();
    });
}

function draw() {
  durationBox.hidden = S.step === 'done';
  if (S.step === 'form') return put(body, ...formView());
  if (S.step === 'done') return put(body, ...doneView());
  put(body, ...pickView());
}

function pickView() {
  const notice = S.notice ? h('p', { class: 'error', text: S.notice }) : null;
  if (S.loading) return [waiting('Loading available times…')];
  if (S.paused) return [h('p', { class: 'empty' },
    'Booking is paused right now. Please email ', h('a', { href: `mailto:${BOOT.contact}`, text: BOOT.contact }), '.')];
  if (!S.slots.length) return [notice, h('p', { class: 'empty' },
    'No free times in the coming weeks. Please email ', h('a', { href: `mailto:${BOOT.contact}`, text: BOOT.contact }), '.')];

  const first = monthStart(new Date(S.slots[0]));
  const last = monthStart(new Date(S.slots[S.slots.length - 1]));
  const m = S.month;
  const shift = n => { S.month = new Date(m.getFullYear(), m.getMonth() + n, 1); draw(); };

  const cells = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => h('div', { class: 'dow', text: d }));
  const lead = (m.getDay() + 6) % 7;
  for (let i = 0; i < lead; i++) cells.push(h('div'));
  const daysInMonth = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  for (let d = 1; d <= daysInMonth; d++) {
    const k = dayKey(new Date(m.getFullYear(), m.getMonth(), d));
    const avail = !!S.byDay[k];
    cells.push(h('button', {
      type: 'button', text: String(d), disabled: !avail,
      class: 'day' + (avail ? ' avail' : '') + (k === S.day ? ' sel' : ''),
      'aria-label': avail ? `${k}, available` : k,
      onclick: () => { S.day = k; draw(); },
    }));
  }

  const daySlots = S.byDay[S.day] || [];
  const times = daySlots.length
    ? h('div', { class: 'times' }, daySlots.map(ms =>
        h('button', { class: 'time', type: 'button', text: fmtTime.format(ms),
                      onclick: () => { S.slot = ms; S.step = 'form'; S.notice = ''; draw(); } })))
    : h('p', { class: 'empty', text: 'Pick a day.' });

  return [
    notice,
    h('div', { class: 'picker' },
      h('div', {},
        h('div', { class: 'month-head' },
          h('button', { class: 'nav', type: 'button', 'aria-label': 'Previous month', disabled: m <= first, onclick: () => shift(-1) }, '‹'),
          h('b', { text: fmtMonth.format(m) }),
          h('button', { class: 'nav', type: 'button', 'aria-label': 'Next month', disabled: m >= last, onclick: () => shift(1) }, '›')),
        h('div', { class: 'grid' }, cells)),
      h('div', {},
        h('p', { class: 'label', text: S.day && daySlots.length ? fmtDay.format(daySlots[0]) : 'Times' }),
        times)),
    h('p', { class: 'note', text: `Times are shown in your time zone (${TZ}).` }),
  ];
}

function slotSummary(start, end) {
  return h('div', { class: 'summary' },
    h('b', { text: fmtDay.format(start) }),
    h('span', { text: `${fmtTime.format(start)}–${fmtTime.format(end)} (${TZ})` }));
}

function formView() {
  const end = S.slot + S.duration * 60000;
  const error = h('p', { class: 'error', hidden: true });
  const guests = h('div', { class: 'field' });
  const guestList = h('div', { style: 'display:grid;gap:8px' });
  const addBtn = h('button', { class: 'link-btn', type: 'button', text: '+ Add guest' });

  const syncAddBtn = () => { addBtn.hidden = guestList.children.length >= T.maxGuests; };
  addBtn.addEventListener('click', () => {
    const row = h('div', { class: 'guest-row' },
      h('input', { type: 'email', name: 'guest', placeholder: 'guest@example.com', 'aria-label': 'Guest email' }),
      h('button', { class: 'remove', type: 'button', 'aria-label': 'Remove guest', text: '×',
                    onclick: () => { row.remove(); syncAddBtn(); } }));
    guestList.append(row);
    row.querySelector('input').focus();
    syncAddBtn();
  });
  if (T.maxGuests > 0) {
    guests.append(h('span', {}, 'Invite others ', h('span', { class: 'opt', text: '(optional, they get the same invite)' })), guestList, addBtn);
  }

  const submit = h('button', { class: 'primary', type: 'submit', text: 'Confirm booking' });
  const pending = h('div', { hidden: true }, waiting('Booking your meeting and sending the invites…'));
  const form = h('form', { novalidate: true },
    h('label', {}, 'Your name', h('input', { name: 'name', required: true, autocomplete: 'name', maxlength: 100 })),
    h('label', {}, 'Your email', h('input', { name: 'email', type: 'email', required: true, autocomplete: 'email' })),
    h('label', {}, h('span', {}, 'What would you like to discuss? ', h('span', { class: 'opt', text: '(optional)' })),
      h('textarea', { name: 'topic', maxlength: 2000 })),
    T.maxGuests > 0 ? guests : null,
    error,
    submit,
    pending);

  form.addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(form);
    const req = {
      typeId: T.id, duration: S.duration, start: S.slot,
      name: String(fd.get('name') || '').trim(),
      email: String(fd.get('email') || '').trim(),
      topic: String(fd.get('topic') || ''),
      guests: fd.getAll('guest').map(String).map(s => s.trim()).filter(Boolean),
    };
    const fail = msg => {
      error.textContent = msg; error.hidden = false; pending.hidden = true;
      submit.disabled = false; submit.textContent = 'Confirm booking';
    };
    if (!req.name) return fail('Please enter your name.');
    if (!/^\S+@\S+\.\S+$/.test(req.email)) return fail('Please enter a valid email address.');

    submit.disabled = true;
    submit.textContent = 'Booking…';
    error.hidden = true;
    pending.hidden = false;
    call('book', req)
      .then(res => { resetSlots(); S.result = Object.assign({ email: req.email, guests: req.guests.length }, res); S.step = 'done'; draw(); })
      .catch(err => {
        const msg = cleanError(err);
        if (msg.includes('SLOT_TAKEN')) {
          S.notice = 'Sorry, that time was just taken. Please pick another one.';
          resetSlots();
          loadSlots();
        } else {
          fail(msg);
        }
      });
  });

  return [
    slotSummary(S.slot, end),
    h('button', { class: 'link-btn', type: 'button', text: '← Choose another time', style: 'margin-bottom:18px',
                  onclick: () => { S.step = 'pick'; draw(); } }),
    form,
  ];
}

function doneView() {
  const r = S.result;
  const who = r.guests ? `${r.email} and your guests` : r.email;
  return [
    h('div', { class: 'ok-icon', text: '✓' }),
    h('h2', { text: "You're booked" }),
    slotSummary(r.start, r.end),
    h('p', {}, `A calendar invite with the Google Meet link was sent to ${who}.`),
    r.meetLink ? h('p', {}, 'Meet link: ', h('a', { href: r.meetLink, target: '_blank', text: r.meetLink })) : null,
    h('p', { class: 'note' }, 'Need to cancel? Use the link in the invite or ', h('a', { href: r.cancelUrl, text: 'cancel here' }), '.'),
  ];
}

// ---------------------------------------------------------------------------
// Availability export: week image and calendar file with busy times only
// ---------------------------------------------------------------------------

const WEEK_HOURS = [8, 18];
const fmtDayShort = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtDate = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

function exportSection() {
  const panel = h('div', { class: 'export-panel', hidden: true });
  let state = 'idle';
  const toggle = h('button', { class: 'link-btn', type: 'button', text: 'Export my availability (week image or calendar file)' });
  toggle.addEventListener('click', () => {
    panel.hidden = !panel.hidden;
    if (panel.hidden || state !== 'idle') return;
    state = 'loading';
    put(panel, waiting('Loading availability…'));
    call('getBusy')
      .then(data => {
        state = 'done';
        if (data.paused) return put(panel, h('p', { class: 'empty', text: 'Availability is not available right now.' }));
        renderExport(panel, data);
      })
      .catch(err => { state = 'idle'; put(panel, h('p', { class: 'error', text: cleanError(err) })); });
  });
  return h('div', { class: 'export' }, toggle, panel);
}

function mondayOf(ms) {
  const d = new Date(ms);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7));
}

function renderExport(panel, data) {
  const weeks = [];
  for (let w = mondayOf(data.from); w.getTime() < data.to; w = new Date(w.getFullYear(), w.getMonth(), w.getDate() + 7)) weeks.push(w);
  let i = 0;
  const canvas = h('canvas', { class: 'week', role: 'img', 'aria-label': 'Week view of busy times' });
  const label = h('b');
  const prev = h('button', { class: 'nav', type: 'button', 'aria-label': 'Previous week', text: '‹' });
  const next = h('button', { class: 'nav', type: 'button', 'aria-label': 'Next week', text: '›' });
  const show = () => {
    drawWeek(canvas, weeks[i], data);
    label.textContent = `Week of ${fmtDate.format(weeks[i])}`;
    prev.disabled = i === 0;
    next.disabled = i === weeks.length - 1;
  };
  prev.addEventListener('click', () => { i--; show(); });
  next.addEventListener('click', () => { i++; show(); });
  put(panel,
    h('div', { class: 'month-head' }, prev, label, next),
    canvas,
    h('div', { class: 'export-actions' },
      h('button', { class: 'secondary', type: 'button', text: 'Download week image', onclick: () => downloadPng(canvas, weeks[i]) }),
      h('button', { class: 'secondary', type: 'button', text: 'Download calendar file (.ics, next month)', onclick: () => downloadIcs(data) })),
    h('p', { class: 'note', text: `Shows only when ${BOOT.owner} is busy, without any meeting details. Times are in ${TZ}.` }));
  show();
}

/** Draws Mon-Fri, WEEK_HOURS, with busy blocks. Light colours so the exported image looks the same everywhere. */
function drawWeek(canvas, monday, data) {
  const W = 760, H = 480, left = 54, top = 84, right = 14, bottom = 40, scale = 2;
  const font = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
  canvas.width = W * scale;
  canvas.height = H * scale;
  const c = canvas.getContext('2d');
  c.setTransform(scale, 0, 0, scale, 0, 0);
  c.fillStyle = '#ffffff';
  c.fillRect(0, 0, W, H);

  c.fillStyle = '#1c2230';
  c.font = `600 18px ${font}`;
  c.fillText(`${BOOT.owner} · availability`, left, 30);
  c.fillStyle = '#5d6878';
  c.font = `13px ${font}`;
  c.fillText(`Week of ${fmtDate.format(monday)} · times in ${TZ}`, left, 50);

  const [h0, h1] = WEEK_HOURS;
  const colW = (W - left - right) / 5, rowH = (H - top - bottom) / (h1 - h0);
  const y = (dayStart, t) => top + (t - dayStart) / 3600000 * rowH;

  for (let d = 0; d < 5; d++) {
    const date = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + d);
    const dayStart = new Date(date.getFullYear(), date.getMonth(), date.getDate(), h0).getTime();
    const dayEnd = new Date(date.getFullYear(), date.getMonth(), date.getDate(), h1).getTime();
    const x = left + d * colW;

    c.fillStyle = '#1c2230';
    c.font = `600 13px ${font}`;
    c.textAlign = 'center';
    c.fillText(fmtDayShort.format(date), x + colW / 2, top - 12);
    c.textAlign = 'left';

    // Past or beyond the known range: grey.
    [[dayStart, Math.min(dayEnd, data.from)], [Math.max(dayStart, data.to), dayEnd]].forEach(([a, b]) => {
      if (b <= a) return;
      c.fillStyle = '#eef0f3';
      c.fillRect(x + 2, y(dayStart, a), colW - 4, y(dayStart, b) - y(dayStart, a));
    });

    data.busy.forEach(([a, b]) => {
      const s = Math.max(a, dayStart), e = Math.min(b, dayEnd);
      if (e <= s) return;
      const top1 = y(dayStart, s), hgt = y(dayStart, e) - top1;
      c.fillStyle = '#c9d6ee';
      c.fillRect(x + 3, top1 + 1, colW - 6, Math.max(hgt - 2, 2));
      if (hgt >= 18) {
        c.fillStyle = '#2b3d63';
        c.font = `12px ${font}`;
        c.fillText('Busy', x + 9, top1 + 14);
      }
    });
  }

  c.strokeStyle = '#e2e6eb';
  c.fillStyle = '#5d6878';
  c.font = `11px ${font}`;
  for (let hr = h0; hr <= h1; hr++) {
    const yy = top + (hr - h0) * rowH;
    c.beginPath(); c.moveTo(left, yy + 0.5); c.lineTo(W - right, yy + 0.5); c.stroke();
    c.fillText(`${String(hr).padStart(2, '0')}:00`, 12, yy + 4);
  }
  for (let d = 0; d <= 5; d++) {
    const xx = left + d * colW;
    c.beginPath(); c.moveTo(xx + 0.5, top); c.lineTo(xx + 0.5, H - bottom); c.stroke();
  }

  const legend = [['#c9d6ee', 'Busy'], ['#ffffff', 'Free'], ['#eef0f3', 'Past']];
  let lx = left;
  legend.forEach(([color, text]) => {
    c.fillStyle = color; c.fillRect(lx, H - 24, 14, 14);
    c.strokeStyle = '#c3c9d1'; c.strokeRect(lx + 0.5, H - 23.5, 13, 13);
    c.fillStyle = '#5d6878'; c.font = `12px ${font}`; c.fillText(text, lx + 20, H - 13);
    lx += 80;
  });
}

function saveFile(blob, name) {
  const a = h('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function fileSlug() {
  return String(BOOT.owner || 'availability').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function downloadPng(canvas, monday) {
  canvas.toBlob(blob => saveFile(blob, `${fileSlug()}-availability-${dayKey(monday)}.png`), 'image/png');
}

function downloadIcs(data) {
  const icsDate = ms => new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const esc = v => String(v).replace(/[\\;,]/g, m => '\\' + m);
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Booking page//Availability//EN', 'CALSCALE:GREGORIAN',
                 'METHOD:PUBLISH', `X-WR-CALNAME:${esc(BOOT.owner)} (busy)`];
  const stamp = icsDate(Date.now());
  data.busy.forEach(([a, b]) => lines.push('BEGIN:VEVENT', `UID:busy-${a}-${b}@booking-page`, `DTSTAMP:${stamp}`,
    `DTSTART:${icsDate(a)}`, `DTEND:${icsDate(b)}`, `SUMMARY:${esc(BOOT.owner)}: busy`, 'TRANSP:OPAQUE', 'END:VEVENT'));
  lines.push('END:VCALENDAR');
  saveFile(new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/calendar' }), `${fileSlug()}-availability.ics`);
}

// ---------------------------------------------------------------------------
// Cancel
// ---------------------------------------------------------------------------

function renderCancel() {
  const c = BOOT;
  if (c.error) return put(app, ...header('Cancel meeting'), h('p', { class: 'muted', text: c.error }));
  if (c.done) return put(app, ...header('Meeting cancelled'), h('p', { class: 'muted', text: 'This meeting is already cancelled.' }));

  const error = h('p', { class: 'error', hidden: true });
  const btn = h('button', { class: 'primary danger', type: 'button', text: 'Cancel meeting' });
  const pending = h('div', { hidden: true }, waiting('Cancelling and notifying everyone…'));
  btn.addEventListener('click', () => {
    btn.disabled = true;
    btn.textContent = 'Cancelling…';
    pending.hidden = false;
    call('cancelBooking', c.id, c.k)
      .then(() => put(app, ...header('Meeting cancelled'),
        h('p', { class: 'muted', text: 'Everyone who was invited has been notified.' })))
      .catch(err => {
        error.textContent = cleanError(err); error.hidden = false; pending.hidden = true;
        btn.disabled = false; btn.textContent = 'Cancel meeting';
      });
  });
  put(app, ...header('Cancel meeting'),
    h('p', { style: 'margin:0 0 8px', text: c.summary }),
    slotSummary(c.start, c.end),
    h('div', { style: 'display:grid;gap:12px' }, btn, pending, error));
}

function start(boot) {
  BOOT = boot;
  T = boot.type;
  document.title = T ? `${T.title} with ${boot.owner}` : `Book a meeting with ${boot.owner}`;
  ({ index: renderIndex, book: renderBook, cancel: renderCancel, notfound: renderNotFound }[boot.mode] || renderNotFound)();
}

if (BOOT) {
  start(BOOT);
} else {
  put(app, waiting('Loading…'));
  const q = new URLSearchParams(location.search);
  const params = {};
  ['t', 'cancel', 'k'].forEach(key => { if (q.get(key)) params[key] = q.get(key); });
  // Start loading the 30-minute slots right away instead of waiting for the page settings.
  if (params.t && !params.cancel) fetchSlots(params.t, 30);
  call('config', params)
    .then(start)
    .catch(() => { app.textContent = 'The booking page could not be loaded. Please try again later.'; });
}
</script>
